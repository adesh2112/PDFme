# yaml-language-server: $schema=https://render.com/schema/render.yaml.json
databases:
  - name: pdfme-db
    databaseName: pdfme
    user: pdfme_user
    plan: free

services:
  - type: web
    name: pdfme
    runtime: node
    plan: free
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: pdfme-db
          property: connectionString
      - key: SESSION_SECRET
        generateValue: true
      - key: RAZORPAY_KEY_ID
        sync: false
      - key: RAZORPAY_KEY_SECRET
        sync: false
      - key: RAZORPAY_WEBHOOK_SECRET
        sync: false
      - key: GEMINI_API_KEY
        sync: false
